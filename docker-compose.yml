services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${APP_MYSQL_DATABASE:-attraction_booking}
      MYSQL_USER: ${APP_MYSQL_USER:-attraction}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-attraction_dev}
      MYSQL_ROOT_PASSWORD: ${APP_MYSQL_ROOT_PASSWORD:-attraction_root_dev}
    ports:
      - "${APP_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data-v2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.8.0-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql-data-v2:
  redis-data:
