server:
  port: ${PORT:8080}

spring:
  application:
    name: attraction-booking-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/attraction_booking}
    username: ${POSTGRES_USER:attraction}
    password: ${POSTGRES_PASSWORD:attraction_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

providers:
  google-places:
    enabled: ${GOOGLE_PLACES_API_ENABLED:false}
    base-url: ${GOOGLE_PLACES_API_BASE_URL:https://places.googleapis.com}
    api-key: ${GOOGLE_PLACES_API_KEY:}
  viator:
    enabled: ${VIATOR_API_ENABLED:false}
    base-url: ${VIATOR_API_BASE_URL:https://api.sandbox.viator.com/partner}
    api-key: ${VIATOR_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
