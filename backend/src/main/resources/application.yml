server:
  port: ${PORT:8080}

spring:
  application:
    name: attraction-booking-backend
  datasource:
    url: ${APP_MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3307/attraction_booking}
    username: ${APP_MYSQL_USER:attraction}
    password: ${APP_MYSQL_PASSWORD:attraction_dev}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

providers:
  google-places:
    enabled: ${GOOGLE_PLACES_API_ENABLED:false}
    base-url: ${GOOGLE_PLACES_API_BASE_URL:https://places.googleapis.com}
    api-key: ${GOOGLE_PLACES_API_KEY:}
  viator:
    enabled: ${VIATOR_API_ENABLED:false}
    base-url: ${VIATOR_API_BASE_URL:https://api.sandbox.viator.com/partner}
    api-key: ${VIATOR_API_KEY:}
    connect-timeout: ${VIATOR_CONNECT_TIMEOUT:3s}
    read-timeout: ${VIATOR_READ_TIMEOUT:8s}
    max-retries: ${VIATOR_MAX_RETRIES:1}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
