spring:
  application:
    name: attraction-booking-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/attraction_booking}
    username: ${POSTGRES_USER:attraction}
    password: ${POSTGRES_PASSWORD:attraction_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
